# Workflow para compilar Tailwind CSS e publicar no GitHub Pages
name: Deploy Tailwind site to Pages

on:
  push:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. Configura o Node.js no servidor do GitHub
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # 2. Instala o Tailwind e outras dependências do seu projeto
      - name: Install dependencies
        run: npm install

      # 3. Compila o Tailwind CSS (Gera o arquivo CSS final)
      - name: Build Tailwind CSS
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 4. Envia a pasta final para o GitHub Pages
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # ATENÇÃO: Mude para './dist' ou '.' dependendo de onde seu index.html e CSS final são gerados
          path: './dist' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
